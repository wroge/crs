name: Run Test

on:
  push:
  pull_request:

permissions:
  contents: write # nötig für Push nach gh-pages

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Restore PROJ grid cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: proj-grids-v1-${{ hashFiles('datum/*.txt', 'crs_test.go') }}
          restore-keys: |
            proj-grids-v1-

      - name: Test with coverage
        run: |
          go test -count=1 -timeout 30m -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Prepare pages folder
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p pages/badges
          pct=$(go tool cover -func=coverage.out | awk '/total:/{gsub(/%/,"",$NF); print $NF}')
          color=red
          awk "BEGIN{exit !($pct >= 70)}" && color=brightgreen
          awk "BEGIN{exit !($pct >= 30 && $pct < 70)}" && color=yellow
          curl -fsSL "https://img.shields.io/badge/coverage-${pct}%25-${color}" \
            -o pages/badges/coverage.svg
          cp coverage.html pages/index.html

      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pages
